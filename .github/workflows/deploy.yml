name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # unit art/sprite live in bucket repos served via jsDelivr
          # (python/make_image_buckets.py). {b} = bucket number; bounds =
          # each bucket's highest unit id, ascending, last bucket
          # open-ended. When make_image_buckets.py reports a NEW bucket,
          # append its boundary here.
          VITE_IMG_CDN: https://cdn.jsdelivr.net/gh/Altterisk/aigis-img-{b}@main
          VITE_IMG_BUCKET_BOUNDS: "615,1225,1885,2580"
          # gitignored site assets (enemy sprites + idle gifs, banners)
          VITE_ASSETS_CDN: https://cdn.jsdelivr.net/gh/Altterisk/aigis-assets@main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
