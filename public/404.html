<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aigis Data</title>
  <script>
    // GitHub Pages serves this for any path with no real file. The app is a
    // HashRouter SPA, so a URL that lost its "#" (e.g. /Aigis-Enemy/units/123)
    // 404s here -- rewrite the path back into a hash route and go home:
    //   /Aigis-Enemy/units/123  ->  /Aigis-Enemy/#/units/123
    (function () {
      var base = "/Aigis-Enemy/";
      var p = location.pathname;
      var route = p.indexOf(base) === 0 ? p.slice(base.length) : "";
      location.replace(base + (route ? "#/" + route : "") + location.search);
    })();
  </script>
</head>
<body></body>
</html>
