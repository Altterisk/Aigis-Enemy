<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aigis Database</title>
  <script>
    // The static host serves this for any path with no real file (Cloudflare
    // Pages: build-output 404.html is the default catch-all). The app is a
    // HashRouter SPA, so a URL that lost its "#" (e.g. /units/123)
    // 404s here -- rewrite the path back into a hash route and go home:
    //   /units/123  ->  /#/units/123
    (function () {
      var base = "/";
      var p = location.pathname;
      var route = p.indexOf(base) === 0 ? p.slice(base.length) : "";
      location.replace(base + (route ? "#/" + route : "") + location.search);
    })();
  </script>
</head>
<body></body>
</html>
